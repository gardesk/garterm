[workspace]
resolver = "2"
members = ["garterm", "garterm-ipc", "gartermctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["mfwolffe"]
license = "MIT"
repository = "https://github.com/mfwolffe/gardesk"

[workspace.dependencies]
# Shared IPC types
garterm-ipc = { path = "garterm-ipc" }

# gartk toolkit
gartk-core = { path = "../gartk/gartk-core" }
gartk-x11 = { path = "../gartk/gartk-x11" }

# Terminal parsing
vte = "0.13"

# GPU rendering
wgpu = "24"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }

# Font handling
fontdue = "0.9"
swash = "0.1"

# Image decoding
image = "0.25"

# PTY
nix = { version = "0.29", features = ["term", "process", "signal", "poll", "fs"] }

# Config
mlua = { version = "0.10", features = ["lua54", "vendored"] }
toml = "0.8"
dirs = "5"

# IPC/Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Unicode
unicode-width = "0.2"
